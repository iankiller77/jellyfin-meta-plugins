on:
  workflow_call:
    inputs:
      repository-name:
        required: true
        type: string
      version:
        required: true
        type: string
      is-unstable:
        required: false
        default: false
        type: boolean
      dotnet-version:
        required: false
        default: "10.0.x"
        description: "The .NET version to setup for the build"
        type: string
      dotnet-target:
        required: false
        default: "net10.0"
        description: "The .NET target to set for JPRM"
        type: string
    secrets:
      token:
        required: true


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.repository-name }}
          token: ${{ secrets.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "${{ inputs.dotnet-version }}"

      - name: Build Jellyfin Plugin
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        id: jprm
        with:
          dotnet-target: "${{ inputs.dotnet-target }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifact
          retention-days: 30
          if-no-files-found: error
          path: ${{ steps.jprm.outputs.artifact }}

  upload:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifact

      - name: Prepare GH Release Assets
        run: |-
          for file in ./*; do
            md5sum ${file#./} >> ${file%.*}.md5
            sha256sum ${file#./} >> ${file%.*}.sha256
          done
          ls -l

      - name: Upload GH Release Assets
        uses: shogo82148/actions-upload-release-asset@aaba0f56bdbc1071f4af234d5cb16055e8a400de # v1.10.4
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./*

  update-manifest:
    needs:
      - upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.repository-name }}
          token: ${{ secrets.token }}

      - name: Install JPRM
        run: pip install jprm --break-system-packages

      - name: Download Release Zip
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |-
          gh release download "${{ inputs.version }}" \
            --repo "${{ inputs.repository-name }}" \
            --pattern "*.zip" \
            --dir release-assets

      - name: Update Manifest
        run: |-
          jprm repo add \
            --url="https://github.com/${{ inputs.repository-name }}/releases/download/${{ inputs.version }}/" \
            --plugin-url="https://github.com/${{ inputs.repository-name }}/releases/download/${{ inputs.version }}/$(basename release-assets/*.zip)" \
            ./manifest.json \
            ./release-assets/*.zip

      - name: Commit and Push Branch
        run: |-
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b update-manifest-${{ inputs.version }}
          git add manifest.json
          git commit -m "Update manifest for ${{ inputs.version }}"
          git push -f origin update-manifest-${{ inputs.version }}

      - name: Create or Update PR
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |-
          EXISTING_PR=$(gh pr list \
            --repo "${{ inputs.repository-name }}" \
            --head "update-manifest-${{ inputs.version }}" \
            --json number \
            --jq '.[0].number')

          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" \
              --repo "${{ inputs.repository-name }}" \
              --title "Update manifest for ${{ inputs.version }}"
          else
            gh pr create \
              --repo "${{ inputs.repository-name }}" \
              --head "update-manifest-${{ inputs.version }}" \
              --base "main" \
              --title "Update manifest for ${{ inputs.version }}" \
              --label "skip-changelog" \
              --body ":robot: This is a generated PR to update \`manifest.json\` for release ${{ inputs.version }}."
          fi

# Configuration for Release Drafter: https://github.com/toolmantim/release-drafter

name-template: 'Version $NEXT_MINOR_VERSION'
tag-template: 'v$NEXT_MINOR_VERSION'
version-template: '$MAJOR.$MINOR.$PATCH'

category-template: '### $TITLE'

# Emoji reference: https://gitmoji.carloscuesta.me/

categories:
  - title: ':boom: Breaking changes'
    labels:
      - breaking
  - title: ':rocket: Major features and improvements'
    labels:
      - major-enhancement
      - major-feature
  - title: ':tada: New features and improvements'
    labels:
      - enhancement
      - feature
  - title: ':ambulance: Major bug fixes'
    labels:
      - major-bug
  - title: ':bug: Bug Fixes'
    labels:
      - bug
      - fix
      - bugfix
      - regression
  - title: ':wastebasket:️ Deprecated'
    label: deprecated
  - title: ':rewind: Reverted Changes'
    labels:
      - revert
      - reverted
  - title: ':white_check_mark: Tests'
    labels:
      - test
      - tests
  - title: ':gear: Code or Repo Maintenance'
    labels:
      - chore
      - cleanup
  - title: ':memo: Documentation updates'
    labels:
      - documentation
  - title: ':arrow_up: Dependency updates'
    labels:
      - dependencies
      - dependency
  - title: ':construction_worker: CI & build changes'
    labels:
      - ci
      - build

exclude-labels:
  - no-changelog
  - skip-changelog
  - invalid

autolabeler:
  - label: ci
    files:
      - '.github/workflows/*'
      - '.github/dependabot.yml'
    branch:
      - '/ci\/.+/'
  - label: documentation
    files:
      - '*.md'
    branch:
      - '/docs?\/.+/'
  - label: bug
    branch:
      - '/fix\/.+/'
    title:
      - '/fix/i'
  - label: chore
    branch:
      - '/chore\/.+/'
    title:
      - '/chore/i'
  - label: feature
    branch:
      - '/feature\/.+/'
  - label: breaking
    branch:
      - '/breaking\/.+/'
    title:
      - '/breaking/i'
  - label: major-feature
    branch:
      - '/major\/.+/'
    title:
      - '/major/i'

version-resolver:
  major:
    labels:
      - breaking
  minor:
    labels:
      - major-enhancement
      - major-feature
  patch:
    labels:
      - enhancement
      - feature
      - bug
      - fix
      - bugfix
  default: patch

template: |-
  <!-- Optional: add a release summary here -->
  <!-- FIXME: [Plugin build can be downloaded here](<url to version download>) -->

  ## :sparkles: What's New

  $CHANGES
